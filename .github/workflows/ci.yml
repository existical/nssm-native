name: Windows build

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.architecture }} ${{ matrix.configuration }}
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        architecture: [x64, x86]
        configuration: [Release, Debug]
    steps:
      - name: Check out complete history and release tags
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Enable isolated SCM configuration and control tests on the disposable runner
        if: matrix.architecture == 'x64' && matrix.configuration == 'Release'
        shell: pwsh
        run: cmake --preset windows-x64 -DNSSM_ENABLE_SCM_TESTS=ON
      - name: Configure, compile and check executable
        shell: pwsh
        run: ./scripts/build.ps1 -Architecture '${{ matrix.architecture }}' -Configuration '${{ matrix.configuration }}'
      - name: Repeat restart and stop acceptance on the disposable runner
        if: matrix.architecture == 'x64' && matrix.configuration == 'Release'
        shell: pwsh
        run: |
          Copy-Item build/windows-x64/Testing/Temporary/LastTest.log build/windows-x64/matrix-tests.log
          ctest --preset windows-x64-release -R '^nssm.lifecycle_live$' --repeat until-fail:10 --output-junit build/lifecycle-repeat.xml
      - name: Retain repeated lifecycle evidence
        if: always() && matrix.architecture == 'x64' && matrix.configuration == 'Release'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: nssm-lifecycle-repeat-evidence
          path: |
            build/windows-x64/matrix-tests.log
            build/windows-x64/Testing/Temporary/LastTest.log
            build/lifecycle-repeat.xml
          if-no-files-found: warn
      - name: Upload executable and debugging symbols
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: nssm-${{ matrix.architecture }}-${{ matrix.configuration }}
          path: |
            build/windows-${{ matrix.architecture }}/bin/${{ matrix.configuration }}/nssm.exe
            build/windows-${{ matrix.architecture }}/bin/${{ matrix.configuration }}/nssm.pdb
          if-no-files-found: error
      - name: Show fixture NSSM events on failure
        if: failure() && matrix.architecture == 'x64' && matrix.configuration == 'Release'
        shell: pwsh
        run: |
          Get-WinEvent -FilterHashtable @{LogName='Application'; ProviderName='nssm'; StartTime=(Get-Date).AddMinutes(-15)} -MaxEvents 40 -ErrorAction SilentlyContinue |
            ForEach-Object { "Event $($_.Id): $($_.Properties.Value -join ' | ')" }

  package:
    name: Release packaging
    needs: build
    runs-on: windows-2022
    steps:
      - name: Check out the pinned candidate with complete history
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Build and test candidate packages from the source archive
        shell: pwsh
        run: ./scripts/package.ps1 -Commit (git rev-parse HEAD) -OutputDirectory dist/candidate -EnableScmTests
      - name: Verify checksums and archive identity
        shell: pwsh
        run: ./tests/package.ps1 -PackageDirectory dist/candidate -WorkDirectory build
      - name: Upload candidate packages and evidence
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: nssm-native-candidate-packages
          path: dist/candidate/
          if-no-files-found: error
